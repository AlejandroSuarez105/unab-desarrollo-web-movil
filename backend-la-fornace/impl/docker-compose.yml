# Despliegue en contenedores (Modulo 6). Solo el API Gateway (8443), el frontend (8080) y el simulador del proveedor de pago (9201)
# publican un puerto, todos solo en 127.0.0.1. Los 7 sistemas, el GraphQL Gateway, la base, Vault y el broker viven en una red
# interna sin salida ni puertos publicados. Uso: python scripts/compose.py (ver README.md).
name: fornace

x-entorno: &entorno
  HOST: 0.0.0.0
  PORT: "8000"
  CA_FILE: /run/pki/ca.crt
  TLS_CERT: /run/pki/tls.crt
  TLS_KEY: /run/pki/tls.key
  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN_FILE: /run/pki/vault.token
  MONGO_URL: mongodb://mongo:27017
  MONGO_AUTH: "1"                       # cada sistema se conecta con su propio usuario de MongoDB (clave en Vault) y solo ve su base
  STOMP_HOST: broker
  STOMP_PORT: "61613"
  LOG_DIR: /logs
  FRONTEND_URL: http://127.0.0.1:8080
  FRONTEND_ORIGIN: http://127.0.0.1:8080
  COMUNAS_COBERTURA: "Maipú,Cerrillos,Pudahuel,Estación Central"
  RL_FACTOR: ${RL_FACTOR:-1}
  VAULT_GRACIA_SEGUNDOS: ${VAULT_GRACIA_SEGUNDOS:-900}
  PASARELA_PUBLICA: https://127.0.0.1:9201
  URL_AUTH: https://auth-service:8000
  URL_CLIENTS: https://clients-service:8000
  URL_INVENTORY: https://inventory-service:8000
  URL_ORDERS: https://orders-service:8000
  URL_PAYMENTS: https://payments-service:8000
  URL_DISPATCH: https://dispatch-service:8000
  URL_NOTIFICATIONS: https://notifications-service:8000
  URL_GRAPHQL: https://graphql-gateway:8000
  URL_PASARELA: https://pasarela-prueba:8000
  URL_CORREO: https://correo-prueba:8000
  URL_GATEWAY: https://api-gateway:8000

x-python: &py
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  environment: *entorno
  networks: [privada]
  depends_on: &dep
    preparacion: { condition: service_completed_successfully }
    mongo: { condition: service_started }
    broker: { condition: service_started }
  healthcheck: &salud
    test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://localhost:8000/health',context=ssl.create_default_context(cafile='/run/pki/ca.crt'),timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 20s

services:
  # ---------- infraestructura (red privada) ----------
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}                          # MongoDB real, con autenticacion: usuario root solo para preparacion y herramientas
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?ejecute python scripts/compose.py preparar}
    volumes: [mongo-datos:/data/db]
    networks: [privada]
    restart: unless-stopped
  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.18}            # modo desarrollo: los secretos viven en memoria y se vuelven a crear al reiniciar
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment: { BAO_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN:?ejecute python scripts/compose.py preparar}", VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN}" }   # la segunda variable permite usar tambien la imagen de HashiCorp Vault
    networks: [privada]
    restart: unless-stopped
  preparacion:
    build: { context: ., dockerfile: Dockerfile.herramientas, args: { BASE: "${PY_BASE:-python:3.13-slim}" } }
    command: ["python", "scripts/bootstrap_compose.py"]
    environment: { VAULT_ADDR: "http://vault:8200", VAULT_DEV_ROOT_TOKEN: "${VAULT_DEV_ROOT_TOKEN}", MONGO_HOST: mongo, MONGO_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}" }
    volumes: ["pki:/pki", "./.run:/salida"]       # /salida recibe solo la CA publica (ca.crt) para que el navegador confie en el laboratorio
    networks: [privada]
    depends_on: { vault: { condition: service_started }, mongo: { condition: service_started } }
    restart: "no"
  broker:
    build: { context: ., dockerfile: Dockerfile.broker }
    mem_limit: 1g
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: broker } }]
    networks: [privada]
    depends_on: { preparacion: { condition: service_completed_successfully } }
    restart: unless-stopped

  # ---------- los 7 sistemas privados ----------
  auth-service:
    <<: *py
    build: &b { context: ., dockerfile: Dockerfile.python, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: auth } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: auth-service } }, "logs:/logs"]
  clients-service:
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: clients } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: clients-service } }, "logs:/logs"]
  inventory-service:
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: inventory } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: inventory-service } }, "logs:/logs"]
  orders-service:
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: orders } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: orders-service } }, "logs:/logs"]
  payments-service:
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: payments } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: payments-service } }, "logs:/logs"]
  dispatch-service:
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: dispatch } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: dispatch-service } }, "logs:/logs"]
  notifications-service:
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: notifications } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: notifications-service } }, "logs:/logs"]

  # ---------- proveedores externos simulados ----------
  pasarela-prueba:                # plataforma de pago de prueba: el navegador llega a ella (9201) y ella avisa al API Gateway
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: pasarela_prueba } }
    networks: [privada, publica]
    ports: ["127.0.0.1:9201:8000"]
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: pasarela-prueba } }, "logs:/logs"]
  correo-prueba:                  # proveedor de correo de prueba (bandeja consultable con clave)
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: correo_prueba } }
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: correo-prueba } }, "logs:/logs"]

  # ---------- GraphQL Gateway (privado) y API Gateway (unica entrada) ----------
  graphql-gateway:
    <<: *py
    build: { context: ., dockerfile: Dockerfile.node, args: { BASE: "${NODE_BASE:-node:22-slim}" } }
    healthcheck:
      <<: *salud
      test: ["CMD", "node", "-e", "const https=require('https'),fs=require('fs');https.get('https://localhost:8000/health',{ca:fs.readFileSync('/run/pki/ca.crt')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: graphql-gateway } }, "logs:/logs"]
  api-gateway:
    <<: *py
    build: { <<: *b, args: { BASE: "${PY_BASE:-python:3.13-slim}", SERVICIO: api_gateway } }
    networks: [privada, publica]
    ports: ["127.0.0.1:8443:8000"]          # unica entrada al backend
    volumes: [{ type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: api-gateway } }, "logs:/logs"]

  # ---------- frontend ----------
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend, args: { BASE: "${PY_BASE:-python:3.13-slim}" } }
    ports: ["127.0.0.1:8080:8080"]
    networks: [publica]
    restart: unless-stopped

  # ---------- herramientas (no forman parte del sistema): semilla, bandeja de correo, pruebas ----------
  herramientas:
    profiles: [herramientas]
    build: { context: ., dockerfile: Dockerfile.herramientas, args: { BASE: "${PY_BASE:-python:3.13-slim}" } }
    environment:
      <<: *entorno
      MONGO_URL: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin     # semilla y pruebas escriben datos de ejemplo directamente
      MONGO_AUTH: "0"
      RUN_DIR: /salida
      CA_FILE: /run/pki/ca.crt
      VAULT_ROOT_TOKEN_FILE: /run/pki/vault-root.token
    volumes:
      - { type: volume, source: pki, target: /run/pki, read_only: true, volume: { subpath: herramientas } }
      - ./.run:/salida
      - ./tests/resultados:/app/tests/resultados
      - logs:/logs:ro
    networks: [privada]

networks:
  privada: { internal: true }     # sin salida a Internet y sin puertos publicados
  publica: {}
volumes:
  mongo-datos: {}
  pki: {}
  logs: {}
